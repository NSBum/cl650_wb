<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Challenger 650 Weight and Balance{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Hamburger menu styles */
        .hamburger {
            display: flex;
            flex-direction: column;
            cursor: pointer;
            padding: 0.5rem;
        }
        .hamburger span {
            width: 25px;
            height: 3px;
            background-color: #374151;
            margin: 3px 0;
            transition: 0.3s;
        }
        .menu-hidden {
            display: none;
        }
        .menu-visible {
            display: block;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <!-- Logo/Title -->
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold text-gray-800">
                        Challenger 650 W&B
                    </a>
                </div>
                
                <!-- Desktop Menu -->
                <div class="hidden md:flex space-x-6">
                    <a href="/" class="text-gray-700 hover:text-blue-600 font-medium {% if request.endpoint == 'index' or request.path == '/' %}text-blue-600{% endif %}">
                        Calculator
                    </a>
                    <a href="/about" class="text-gray-700 hover:text-blue-600 font-medium {% if request.endpoint == 'about' or request.path == '/about' %}text-blue-600{% endif %}">
                        About
                    </a>
                </div>
                
                <!-- Mobile Hamburger Button -->
                <div class="md:hidden">
                    <button id="hamburger-btn" class="hamburger" aria-label="Toggle menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </div>
            
            <!-- Mobile Menu -->
            <div id="mobile-menu" class="menu-hidden md:hidden pb-4">
                <a href="/" class="block py-2 text-gray-700 hover:text-blue-600 font-medium {% if request.endpoint == 'index' or request.path == '/' %}text-blue-600{% endif %}">
                    Calculator
                </a>
                <a href="/about" class="block py-2 text-gray-700 hover:text-blue-600 font-medium {% if request.endpoint == 'about' or request.path == '/about' %}text-blue-600{% endif %}">
                    About
                </a>
            </div>
        </div>
    </nav>
    
    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </div>
    
    <!-- Footer -->
    <footer class="bg-white border-t mt-auto py-4">
        <div class="container mx-auto px-4 text-center text-gray-600 text-sm">
            <p>Copyright (c) 2025 Alan Duncan | Licensed under MIT License with Non-Commercial Use Restriction</p>
        </div>
    </footer>
    
    <!-- Hamburger Menu JavaScript -->
    <script>
        document.getElementById('hamburger-btn').addEventListener('click', function() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('menu-hidden');
            menu.classList.toggle('menu-visible');
        });
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
